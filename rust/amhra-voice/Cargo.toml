[package]
name = "amhra-voice"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
amhra-audio.workspace = true
aes = "0.9"
aes-gcm = { version = "0.11", features = ["aes"] }
chacha20poly1305 = "0.11"
# DAVE truncates its GCM tag to 8 bytes, below the 12 `aes-gcm` will accept, so
# the receive side assembles GCM from its parts.
ctr = "0.10"
ghash = "0.6"
subtle = "2"
hmac = "0.13"
sha2 = "0.11"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
openmls = "0.8"
opus = "0.4"
openmls_basic_credential = "0.5"
openmls_rust_crypto = "0.5"
openmls_traits = "0.5"
rand = "0.10"
tls_codec = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
	"connect",
	"rustls-tls-webpki-roots",
] }

[dev-dependencies]
amhra-audio.workspace = true
