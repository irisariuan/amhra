[package]
name = "amhra-sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "amhra-sidecar"
path = "src/main.rs"

[dependencies]
amhra-audio.workspace = true
amhra-voice = { path = "../amhra-voice" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
ts-rs = "10"
# Voice commands: wake word, end of speech and speech to text, all through
# sherpa-onnx. The build script downloads a prebuilt static library for the
# target (about 20MB), which is why this is off by default.
# Linked statically unless `shared-onnxruntime` asks for the shared build: neither crate's
# default is used, because the two modes cannot both be on.
sherpa-onnx = { version = "1.13.8", optional = true, default-features = false }
sherpa-onnx-sys = { version = "1.13.8", optional = true, default-features = false }
# The Cantonese voice's lexicon has simplified characters only.
fast2s = { version = "0.3", optional = true }

[dev-dependencies]
# The wake_live example joins a channel the way amhra-voice's examples do.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
	"connect",
	"rustls-tls-webpki-roots",
] }

[features]
voice-commands = ["dep:sherpa-onnx", "dep:sherpa-onnx-sys", "dep:fast2s"]
# Link sherpa-onnx's shared build instead. Its onnxruntime recognised a
# command 3.4x faster on the CPU here (41ms against 141ms on two threads), and
# has Core ML on macOS for `--recogniser-provider coreml`. The libraries are
# copied next to the binaries, and build.rs points them there.
shared-onnxruntime = ["voice-commands", "sherpa-onnx/shared", "sherpa-onnx-sys/shared"]

[[example]]
name = "wake_wav"
required-features = ["voice-commands"]

[[example]]
name = "wake_live"
required-features = ["voice-commands"]

[[example]]
name = "tts_wav"
required-features = ["voice-commands"]

[[example]]
name = "tts_check"
required-features = ["voice-commands"]
